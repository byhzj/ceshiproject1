name: "Test"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-22.04   # 换用 Ubuntu 22.04，出口 IP 可能与 24.04 不同
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Install uv and Python (latest 3.13)
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Wait before tests (avoid WAF blocking)
        run: sleep 3   # 等待3秒，让服务器放松

      - name: Run tests
        run: uv run pytest tests/ -v