name: "Test"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Create virtualenv
        run: uv venv

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y allure

      - name: Install Python dependencies
        run: |
          uv pip install -r requirements.txt
          # 保险：确保 allure-pytest 在，没有就补装
          uv pip install allure-pytest

      - name: Wait before tests (avoid WAF blocking)
        run: sleep 3

      - name: Run tests -> allure results
        if: always()
        run: uv run pytest tests/ -v --alluredir=allure-results

      - name: Generate Allure HTML report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report