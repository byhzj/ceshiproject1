name: "Test"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [ opened ]


jobs:
  test:
    runs-on: ubuntu-latest
    container: astral/uv:python3.13.4
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: install Dependency
        run: uv sync
      - name: Test
        run: uv run pytest tests/