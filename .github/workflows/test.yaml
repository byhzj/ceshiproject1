name: "Test"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Install uv and Python (latest 3.13)
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -r requirements.txt

      - name: Wait before tests (avoid WAF blocking)
        run: sleep 3


      - name: Install Allure CLI and Java (required by Allure)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless allure
          

      - name: Run tests with Allure results
        run: uv run pytest tests/ -v --alluredir=allure-results

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report