name: "Test"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]


jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: install Dependency
        run: uv sync

      - name: Test
        run: uv run pytest tests/