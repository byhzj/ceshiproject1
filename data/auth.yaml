# 基础账号，用于 token
account:
  username: admin
  password: HM_2023_test
  code: "2"

# 登录参数化用例
login_cases:
  - id: TC_LOGIN_001
    description: "登录成功 - 正确账号+正确验证码"
    request:
      username: admin
      password: HM_2023_test
      code: "2"
      uuid_from: captcha
    expected:
      status: 200
      code: 200
      msg: "操作成功"

  - id: TC_LOGIN_002
    description: "登录失败 - 验证码错误"
    request:
      username: admin
      password: HM_2023_test
      code: "000000"
      uuid_from: captcha
    expected:
      status: 200
      code: 500
      msg: "验证码错误"

  - id: TC_LOGIN_003
    description: "登录失败 - 密码错误"
    request:
      username: admin
      password: wrong_pwd
      code: "2"
      uuid_from: captcha
    expected:
      status: 200
      code: 500
      msg: "用户不存在/密码错误"

  - id: TC_LOGIN_004
    description: "登录失败 - uuid为空"
    request:
      username: admin
      password: HM_2023_test
      code: "2"
      uuid_from: fixed
      uuid_value: ""
    expected:
      status: 200
      code: 500
      msg: "验证码已失效"